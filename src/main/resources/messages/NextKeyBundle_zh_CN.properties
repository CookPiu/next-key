conf.header=# Next Key 配置文件。设置界面（Settings | Tools | Next Key）会重写本文件，\n\
# 手工编辑同样有效。改动在下次弹出时生效，不必重启 IDE。\n\
#\n\
# 每行一个动作：\n\
#   <action-id>                        显示，用 IDE 自带的动作名\n\
#   <action-id> = 我的名字             显示，并把名字换成你写的\n\
#   <action-id> = 我的名字 | 分类      再指定它归到哪个分类\n\
#   -<action-id>                       不显示（注意行首的减号）\n\
#\n\
# 行尾 # 之后是注释，注释里标的是该动作的快捷键和原名，改动时不必去别处查 action id。\n\
#\n\
# 内置分类：{0}\n\
# 也可以直接写别的名字，自成一类。
conf.showAll=# true 则显示全部快捷键，忽略下面的逐条开关
conf.mergeNumbered=# 把只差末位数字的一组动作合并成一行，如 0-9 书签
conf.delay=# 修饰键按住多久后弹出提示，100-2000 毫秒
conf.opacity=# 提示浮窗的不透明度，取值 0.2 到 1.0
