conf.header=# Next Key configuration. The settings UI (Settings | Tools | Next Key) rewrites this\n\
# file; editing it by hand works just as well. Changes apply to the next popup, no restart.\n\
#\n\
# One action per line:\n\
#   <action-id>                        show it, under the name the IDE gives it\n\
#   <action-id> = My name              show it under a name of your own\n\
#   <action-id> = My name | Category   ... and put it in a category\n\
#   -<action-id>                       hide it (note the leading minus)\n\
#\n\
# Anything after # is a comment. The comment on each line below carries that action''s\n\
# shortcut and its original name, so you never have to look up an action ID elsewhere.\n\
#\n\
# Built-in categories: {0}\n\
# Any other text works too and becomes a category of its own.
conf.showAll=# true shows every shortcut and ignores the per-action switches below
conf.mergeNumbered=# merge actions that differ only by a trailing number, such as bookmarks 0-9
conf.delay=# how long a modifier must be held before the popup appears, 100-2000 ms
conf.opacity=# popup opacity, from 0.2 to 1.0
