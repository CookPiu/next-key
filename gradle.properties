# 版本号的唯一来源。plugin.xml 里那份供 build.ps1 手工构建使用，
# 两者不一致时 build.ps1 会报错，Gradle 构建则以这里为准。
pluginVersion=0.4.1

org.gradle.jvmargs=-Xmx2g
org.gradle.caching=true
org.gradle.configuration-cache=true

# 下载的 IDE 依赖有 1GB 上下，放 D 盘避免占系统盘
# 需要时取消注释并按自己的路径调整
# org.gradle.project.intellijPlatformCachePath=D:/Projects/.gradle-intellij-cache
